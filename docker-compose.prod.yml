# English Speaking Coach - 完整的 Docker 部署配置

version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: english-coach-backend
    ports:
      - "8000:8000"
    environment:
      # DashScope API 配置
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      
      # OpenAI API 配置
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      
      # 服务器配置
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      
      # 数字人配置
      - AVATAR_APP_ID=${AVATAR_APP_ID:-}
      - AVATAR_SERVER_USER_ID=${AVATAR_SERVER_USER_ID:-}
      
      # TTS 配置
      - DEFAULT_TTS_VOICE=af_zhixiaobai_oral
      
      # LLM 配置
      - LLM_MODEL=gpt-4o-mini
      - LLM_TEMPERATURE=0.7
      - LLM_MAX_TOKENS=500
    
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: english-coach-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: english-coach-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
    profiles:
      - with-nginx

networks:
  app-network:
    driver: bridge
